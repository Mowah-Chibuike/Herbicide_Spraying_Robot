<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Platform</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="config_style.css" />
  </head>
  <body>
    <div class="overlay">
      <div class="alert">
        <p class="alert-message"></p>
      </div>
      <button id="close">&times;</button>
      <div class="modal">
        <h3 id="modal-heading"></h3>
        <form action="" id="update-form">
          <div class="form_input">
            <label for="new-password">New Password*</label>
            <input
              type="text"
              id="new-password"
              placeholder="password"
              required
              maxlength="64"
            />
          </div>
          <button type="submit">Update</button>
        </form>
      </div>
    </div>
    <div class="header">
      <img src="icons/hotspot-icon.png" alt="" class="hotspot-icon" />

      <div class="heading">
        <h2>IOT PLATFORM</h2>
        <h3>Device #4783</h3>
      </div>

      <ul class="nav">
        <li><a href="./index.html">Home</a></li>
      </ul>
    </div>
    <section class="wifi-form">
      <h3>ADD WIFI CREDENTIALS</h3>
      <form action="" id="add-form">
        <div class="form_input">
          <label for="ssid">SSID*</label>
          <input
            type="text"
            id="ssid"
            placeholder="ssid"
            required
            maxlength="32"
          />
        </div>

        <div class="form_input">
          <label for="password">Password*</label>
          <input
            type="password"
            id="password"
            placeholder="password"
            required
            maxlength="64"
          />
        </div>

        <button type="submit">Add</button>
      </form>
    </section>
    <section class="wifi-list">
      <h3>STORED WIFI CREDENTIALS</h3>
      <p class="status">
        Count:
        <span id="lower-limit">0</span>/<span id="upper-limit">0</span>
      </p>
      <div class="content"></div>
    </section>
  </body>
  <script src="config_script.js"></script>
</html>
