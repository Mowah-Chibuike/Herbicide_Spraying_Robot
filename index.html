<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Platform</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body>
    <div class="header">
      <img src="icons/hotspot-icon.png" alt="" class="hotspot-icon" />

      <div class="heading">
        <h2>IOT PLATFORM</h2>
        <h3>Device #4783</h3>
      </div>
    </div>

    <div class="video">
      <img id="stream" src="" />
      <p class="cam-status disconnected">Camera: Disconnected</p>
    </div>

    <div class="contain">
      <div class="battery">
        <img src="icons/battery-icon.png" alt="" class="battery-icon" />
        <div class="battery-level">
          <h3>Battery</h3>
          <p><span id="battery">...</span> V</p>
        </div>
      </div>

      <div class="volume">
        <img src="icons/volume-icon.png" alt="" class="battery-icon" />
        <div class="volume-level">
          <h3>Volume</h3>
          <p><span id="volume">...</span> %</p>
        </div>
      </div>
    </div>

    <div class="contain">
      <div class="speed-contain">
        <img src="icons/speed-icon.png" alt="" class="battery-icon" />
        <div class="speed-level">
          <h3>Speed</h3>
          <p><span id="speed">50</span> %</p>
        </div>
      </div>

      <div class="wifi">
        <img src="icons/wifi-icon.png" alt="" class="battery-icon" />
        <div class="wifi-strength">
          <h3>Signal</h3>
          <p id="signal">Disconnected</p>
        </div>
      </div>
    </div>

    <div class="speed-control">
      <label for="speed-ctrl"></label>
      <input
        type="range"
        min="0"
        max="100"
        id="speed-ctrl"
        class="speed"
        value="50"
      />
      <div id="speed-labels">
        <p>Slow</p>
        <p>Fast</p>
      </div>
    </div>

    <div class="movement-control">
      <p>Movement Control</p>
      <br />
      <div class="control">
        <button id="forward"><img src="icons/arrow-up.png" alt="" /></button>

        <div class="middle-row">
          <button id="left"><img src="icons/arrow-left.png" alt="" /></button>
          <button id="spray"><img src="icons/center.png" alt="" /></button>
          <button id="right"><img src="icons/arrow-right.png" alt="" /></button>
        </div>

        <button id="backward"><img src="icons/arrow-down.png" alt="" /></button>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</html>
